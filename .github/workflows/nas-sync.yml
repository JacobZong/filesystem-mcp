# Fork-only: keeps branch `nas` (the image the home NAS runs) in step with
# upstream releases. Lives on the default branch because GitHub only fires
# scheduled workflows there; all real work happens on `nas`.
#
# Daily: merge the latest upstream release (if new) -> full test suite ->
# build -> integration test against the current Xberg -> publish :nas.
# Without a new release it still runs the integration test, so an Xberg
# change that breaks us shows up as a failed run (GitHub emails the owner).
name: NAS sync upstream

on:
  schedule:
    - cron: '0 18 * * *' # 03:00 JST
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Publish :nas even without a new upstream release'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: nas-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: nas
          fetch-depth: 0

      - name: Merge latest upstream release
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          latest=$(gh release view -R j0hanz/filesystem-mcp --json tagName -q .tagName)
          current=$(cat .nas/upstream-version 2>/dev/null || echo none)
          echo "upstream latest=$latest, merged=$current"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags https://github.com/j0hanz/filesystem-mcp.git "refs/tags/$latest:refs/tags/upstream-$latest"
          if ! git merge --no-edit -m "chore(nas): merge upstream $latest" "upstream-$latest"; then
            git merge --abort
            echo "::error::Merge conflict with upstream $latest. Nothing was published; resolve on branch nas by hand."
            exit 1
          fi
          echo "$latest" > .nas/upstream-version
          git add .nas/upstream-version
          git commit -m "chore(nas): record upstream $latest"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install poppler and ffmpeg for the document tool tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils ffmpeg

      - run: npm ci --ignore-scripts
      - run: npm run check

      - name: Build candidate image
        run: docker build -t nas-candidate .

      - name: Integration test against the current Xberg
        run: |
          python3 .nas/make_fixtures.py "$RUNNER_TEMP/fixtures" nas-candidate
          python3 .nas/integration.py nas-candidate "$RUNNER_TEMP/fixtures" ghcr.io/xberg-io/xberg:core

      - name: Publish :nas and push branch
        if: steps.merge.outputs.changed == 'true' || inputs.force_publish
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          sha=$(git rev-parse HEAD)
          docker tag nas-candidate ghcr.io/jacobzong/filesystem-mcp:nas
          docker tag nas-candidate "ghcr.io/jacobzong/filesystem-mcp:nas-$sha"
          docker push ghcr.io/jacobzong/filesystem-mcp:nas
          docker push "ghcr.io/jacobzong/filesystem-mcp:nas-$sha"
          git push origin nas
          echo "### Published nas-$sha (upstream ${{ steps.merge.outputs.latest }})" >> "$GITHUB_STEP_SUMMARY"
