# Fork-only: builds the image the home NAS runs (ghcr.io/jacobzong/filesystem-mcp:nas).
# Not part of the upstream PR.
name: NAS image

# Manual only (2026-10-10): :nas is published by the gated nas-sync workflow
# (tests + integration) on the default branch; a push to nas must not skip it.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jacobzong/filesystem-mcp:nas
            ghcr.io/jacobzong/filesystem-mcp:nas-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
